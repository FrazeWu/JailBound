  reverse_induction: persuasion_deception

exact_risk_category:
  harmbench:
    chemical_biological: illegal_criminal
    cybercrime_intrusion: cybersecurity_misuse
    harassment_bullying: discrimination_toxicity
  safetybench:
    "Ethics and Morality": unsafe_unethical
    "Illegal Activities": illegal_criminal
    "Mental Health": unsafe_unethical
    "Offensiveness": discrimination_toxicity
    "Physical Health": high_stakes_advice
    "Privacy and Property": privacy_personal_data
    "Unfairness and Bias": discrimination_toxicity
  jailbreakbench:
    Disinformation: misinformation_reliability
    "Economic harm": fraud_scam
    "Expert advice": high_stakes_advice
    "Fraud/Deception": fraud_scam
    "Government decision-making": sensitive_org_gov
