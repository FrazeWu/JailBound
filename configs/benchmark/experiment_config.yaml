# Comparison Experiment Configuration
# Edit this file to customize experiment settings

# ============================================================================
# Input/Output Settings
# ============================================================================

# Path to input attack prompts (JSON format)
INPUT_DATA: "data/behaviors.jsonl"

# Output directory pattern (supports datetime formatting)
OUTPUT_DIR_PATTERN: "outputs/comparison_{timestamp}"

# ============================================================================
# Dataset Selection
# ============================================================================

# Available datasets: advbench, hh_rlhf, safetybench, sgbench, harmbench
# Comment out datasets you don't want to use
DATASETS:
  - advbench
  # - hh_rlhf
  # - safetybench
  # - sgbench
  - harmbench

# Maximum samples per dataset (0 = use all available)
MAX_SAMPLES_PER_DATASET: 50

# ============================================================================
# Optimization Methods
# ============================================================================

# Available methods: gpo, quote, combined
# Comment out methods you don't want to test
OPTIMIZATION_METHODS:
  - gpo
  - quote
  - combined

# ============================================================================
# Model Selection
# ============================================================================

# Whether to evaluate on local open-source models
USE_LOCAL_MODELS: true

# Whether to evaluate on closed-source API models
USE_CLOSED_SOURCE_MODELS: true

# Specific models to include (empty = use all from modellist.txt)
# Example: ["qwen-72b", "llama-3.1-70b-instruct", "gpt-4o"]
SPECIFIC_MODELS: []

# ============================================================================
# Evaluation Settings
# ============================================================================

# Batch size for parallel evaluation
BATCH_SIZE: 10

# Judge score threshold for success (0.0-1.0)
SUCCESS_THRESHOLD: 0.7

# Maximum tokens for model response
MAX_RESPONSE_TOKENS: 512

# Temperature for sampling (0.0 = deterministic)
TEMPERATURE: 0.0

# ============================================================================
# API Configuration
# ============================================================================

# Service settings are supplied at runtime through BENCHMARK_API_KEY and
# BENCHMARK_API_BASE_URL. This template contains no deployment credentials.
API_KEY_ENV: "BENCHMARK_API_KEY"
API_BASE_URL_ENV: "BENCHMARK_API_BASE_URL"
LOCAL_MODEL_PATH: "models"

# ============================================================================
# Logging Settings
# ============================================================================

# Log level: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL: "INFO"

# Save detailed logs to file
SAVE_LOG_TO_FILE: true

# Log directory
LOG_DIR: "../logs"

# ============================================================================
# Advanced Settings
# ============================================================================

# Enable/disable specific features
FEATURES:
  enable_progress_bar: true
  enable_intermediate_saving: true
  enable_error_recovery: true
  max_retries_per_request: 3
  request_timeout_seconds: 60

# Parallel processing
PARALLEL:
  # Number of worker threads (0 = auto-detect)
  num_workers: 0
  # Use multiprocessing instead of threading
  use_multiprocessing: false
