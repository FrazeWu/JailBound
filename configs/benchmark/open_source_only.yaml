# Open-Source Models Only Configuration
# 仅测试开源模型配置

# ============================================================================
# Input/Output Settings
# ============================================================================

INPUT_DATA: "data/behaviors.jsonl"
OUTPUT_DIR_PATTERN: "outputs/comparison_open_source_{timestamp}"

# ============================================================================
# Dataset Selection
# ============================================================================

DATASETS:
  - advbench
  - harmbench

MAX_SAMPLES_PER_DATASET: 10

# ============================================================================
# Optimization Methods
# ============================================================================

OPTIMIZATION_METHODS:
  - baseline
  - gpo
  - quote
  - combined

# ============================================================================
# Model Selection - OPEN SOURCE ONLY
# ============================================================================

USE_LOCAL_MODELS: true
USE_CLOSED_SOURCE_MODELS: false  # Disable closed-source models

SPECIFIC_MODELS: []

# ============================================================================
# Evaluation Settings
# ============================================================================

BATCH_SIZE: 5
SUCCESS_THRESHOLD: 0.7
MAX_RESPONSE_TOKENS: 512
TEMPERATURE: 0.0

# ============================================================================
# API Configuration
# ============================================================================

API_KEY_ENV: "BENCHMARK_API_KEY"
API_BASE_URL_ENV: "BENCHMARK_API_BASE_URL"
