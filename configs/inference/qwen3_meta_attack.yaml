# qwen3-X-infer-lora.yaml
### model
model_name_or_path: Qwen/Qwen3-0.5B-Instruct
adapter_name_or_path: saves/qwen3-0.5b/lora/meta-attack-v2
trust_remote_code: true

### template
template: qwen3_nothink

### inference
finetuning_type: lora
infer_backend: huggingface  # 常见：huggingface / vllm / sglang / ktransformers
infer_dtype: bfloat16        # 没 bf16 就用 fp16；CPU 用 fp32
max_new_tokens: 512
temperature: 0.7
top_p: 0.9
top_k: 50
repetition_penalty: 1.05
do_sample: true

### generate (可选：一些框架用这个名字)
# seed: 42
