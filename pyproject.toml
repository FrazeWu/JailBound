[project]
name = "comprehensive-bench"
version = "0.1.0"
description = "Implementation code and offline review tests for a modular benchmark workflow."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "vllm==0.9.0.1",
    "transformers==4.51.1",
    "sentence-transformers==3.0.1",
    "huggingface-hub==0.32.0",
    "openai==1.52.0",
    "numpy==1.26.4",
    "rouge==1.0.1",
    "nltk==3.8.1",
    "absl-py==1.4.0",
    "torch==2.7.0",
    "pandas==2.3.3",
    "httpx==0.27.2",
    "setuptools==80.9.0",
    "python-dotenv==1.2.1",
    "tqdm==4.66.5",
    "accelerate==1.12.0",
    "unsloth==2024.8",
    "hf-transfer>=0.1.9",
    "modelscope>=1.34.0",
    "datasets==4.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "safetensors>=0.7.0",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.2",
    "evaluate>=0.4.6",
    "rouge-score>=0.1.2",
    "requests>=2.31",
    "pydantic>=2.11,<3",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.6,<2",
    "lifelines>=0.30,<1",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
url = "https://repo.huaweicloud.com/repository/pypi/simple/"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = [
    "tests/corpora",
    "tests/test_python_sources_compile.py",
    "tests/reviewer_eval",
]
pythonpath = ["src"]
addopts = "-ra"
